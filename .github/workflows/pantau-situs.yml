name: Pantau situs

# Pemeriksa sintetis dari luar: tulisan terbaru WP harus tampil di situs.
# Gagal membuka satu issue berlabel pemantau-situs (bukan satu per run);
# pulih menutupnya dengan komentar. Lihat docs/insiden/.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pantau-situs
  cancel-in-progress: false

jobs:
  artikel-terbaru:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cek tulisan terbaru tampil
        id: cek
        run: node scripts/pantau-artikel-terbaru.mjs 2>&1 | tee hasil.txt; exit ${PIPESTATUS[0]}

      - name: Buka atau perbarui issue
        if: failure() && steps.cek.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pemantau-situs --color B60205 --description "Gagal pemeriksa sintetis" 2>/dev/null || true
          nomor=$(gh issue list --label pemantau-situs --state open --json number --jq '.[0].number')
          isi="$(cat hasil.txt)

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Langkah diagnosis: docs/hosting-railway.md §9 dan docs/insiden/."
          if [ -n "$nomor" ]; then
            gh issue comment "$nomor" --body "$isi"
          else
            gh issue create --label pemantau-situs --title "Situs tidak menampilkan tulisan terbaru" --body "$isi"
          fi

      - name: Tutup issue yang sudah pulih
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for nomor in $(gh issue list --label pemantau-situs --state open --json number --jq '.[].number'); do
            gh issue close "$nomor" --comment "Pulih: $(cat hasil.txt)"
          done
