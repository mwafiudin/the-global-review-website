version: 2

updates:
  # next & react di-pin eksak di package.json, jadi PR update-nya memang perlu
  # muncul untuk direview — tidak ada caret yang diam-diam menaikkannya.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Satu PR untuk semua minor & patch; major tetap sendiri-sendiri supaya
      # catatan rilisnya sempat dibaca.
      minor-dan-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # ESLint 10 menghapus metode context lawas (context.getFilename dkk).
      # eslint-plugin-react — dibundel eslint-config-next dan masih memakainya
      # — mentok di 7.37.5 dengan peer "eslint: ^9.7", jadi lint langsung
      # runtuh: "Error while loading rule 'react/display-name'".
      # Tanpa ignore, Dependabot terus membuka PR yang mustahil digabung.
      # CABUT begitu eslint-plugin-react merilis dukungan ESLint 10 dan
      # eslint-config-next memakainya.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  # Pasangan wajib dari keputusan mem-pin action ke tag mayor (@v5): tag bisa
  # bergeser, dan action pihak ketiga yang basi adalah jalur masuk supply-chain.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
